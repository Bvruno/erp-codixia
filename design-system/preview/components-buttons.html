<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERP Codixia buttons</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: var(--text-sm); }
      main { max-width: 860px; margin: 0 auto; padding: var(--space-12) var(--space-6); display: grid; gap: var(--space-8); }
      h1 { margin: 0; font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-display); }
      h2 { margin: 0 0 var(--space-3); font-size: var(--text-lg); }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-h); padding: 0 var(--space-4); border: 1px solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--fg); font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard); }
      .btn:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
      .btn:disabled { opacity: 0.5; pointer-events: none; }
      .btn-primary { background: var(--accent); color: var(--accent-on); }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-primary:active { background: var(--accent-active); }
      .btn-secondary { background: var(--surface-warm); }
      .btn-outline { border-color: var(--border); }
      .btn-outline:hover { background: var(--surface-warm); }
      .btn-ghost { color: var(--muted); }
      .btn-ghost:hover { background: var(--surface-warm); color: var(--fg); }
      .btn-destructive { background: var(--danger); color: oklch(0.985 0 0); }
      .btn-link { height: auto; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
      .btn-sm { height: var(--control-h-sm); padding: 0 var(--space-3); }
      .btn-lg { height: var(--control-h-lg); padding: 0 var(--space-6); }
      .btn-icon { width: var(--control-h); padding: 0; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Botones</h1>
      </header>

      <section>
        <h2>Variantes</h2>
        <div class="row">
          <button class="btn btn-primary" type="button">Guardar cambios</button>
          <button class="btn btn-secondary" type="button">Secundario</button>
          <button class="btn btn-outline" type="button">Outline</button>
          <button class="btn btn-ghost" type="button">Ghost</button>
          <button class="btn btn-destructive" type="button">Eliminar</button>
          <button class="btn btn-link" type="button">Enlace</button>
        </div>
      </section>

      <section>
        <h2>Tamaños y estados</h2>
        <div class="row">
          <button class="btn btn-primary btn-sm" type="button">sm</button>
          <button class="btn btn-primary" type="button">md</button>
          <button class="btn btn-primary btn-lg" type="button">lg</button>
          <button class="btn btn-outline btn-icon" type="button" aria-label="Icono">★</button>
          <button class="btn btn-primary" type="button" disabled>Deshabilitado</button>
        </div>
      </section>

      <section>
        <h2>Foco</h2>
        <p style="color: var(--muted); margin: 0 0 var(--space-3)">Pulsa Tab para ver el anillo de 3px derivado de --accent.</p>
        <div class="row">
          <button class="btn btn-primary" type="button">Primero</button>
          <button class="btn btn-outline" type="button">Segundo</button>
        </div>
      </section>
    </main>
  </body>
</html>
