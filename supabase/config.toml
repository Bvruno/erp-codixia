# Configuración del stack local de Supabase (solo desarrollo/testing).
# Uso: `npm run db:start` y luego `npm run test:rls` (correrá supabase/tests).
# Puertos 5442x: coexisten con otros stacks locales (p. ej. wacrm en 5432x).
project_id = "erp-codixia"

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
# Misma versión que producción (Supabase remoto en PostgreSQL 17.6).
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54423

[local_smtp]
enabled = true
port = 54424

# 54327 lo ocupa el stack wacrm; usar un puerto propio.
[analytics]
enabled = true
port = 54427

# URLs a las que Supabase puede redirigir (reset de contraseña, OAuth) desde
# las dos SPAs locales. Sin esto GoTrue rechaza los redirectTo del SPA.
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:5174/**"]
